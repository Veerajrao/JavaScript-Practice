<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors(With DOM And AutoPlay feature)</title>
    <link rel="stylesheet" href="rock-paper-style.css">
</head>
<body>
    <p class="title">
        Rock Paper Scissors
    </p>
    <button class="move-btn js-btn-rock"><img class="move-icon" src="images/rock-emoji.png"></button>
    <button class="move-btn" onclick="movesPicked('Paper');"><img class="move-icon" src="images/paper-emoji.png"></button>
    <button class="move-btn" onclick="movesPicked('Scissors');"><img class="move-icon" src="images/scissors-emoji.png"></button>
    <p class="js-result results"></p>
    <p class="js-Moves moves"></p>
    <p class="display-scr scr"></p>
    <button class="rest-btn" onclick="resetScr();">Reset score</button>
    <button class="autoplay" onclick="autoplay();">Auto Play</button>
    <script src="rock-paper-game.js"></script>
</body>
</html>
