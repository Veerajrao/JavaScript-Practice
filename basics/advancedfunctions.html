<!DOCTYPE html>
<html>
    <head>
        <title>Advanced functions</title>
    </head>
    <body>
        <button id="btn" onclick="loadingfun()">Subscribe</button>
        <button onclick="" class="evt-btn">EventListner</button>
        <script>
            const num = 2;
            //function without function name because it is assigned to an variable
            const function1 = function() { 
                console.log('hello2');
            };
            console.log(function1);
            console.log(typeof function1);
            function1();
            const obj1 = { //you can have function inside an object because a function can be an value
                num: 2,
                fun: function(){
                    console.log("Hello inside an object");
                }
            };
            obj1.fun();
            function display(val){
                console.log(val);
            }
            display(2);//passsing a value into function
            function run(val2){
                val2();
            }
            run(function(){ //passing an function inside as an argument of the function
                console.log("hello3");
            });

            //setTimeout function of js
            setTimeout(function() {
                console.log("inside timeout");},2000);
            console.log('After timeout line');
            setInterval(function(){
                console.log("inside interval");
            },5000);
            console.log('outside settimeout ad setinterval');

            //settimeout of button
            let Subscribed = false;
            function loadingfun(){
                let btnn = document.getElementById("btn");
                btnn.innerHTML = "Loading...";
                btnn.disabled = true;
                setTimeout(() => { //when you are passing the function inside another function as parameter you need to use arrow function
                     if(Subscribed == false){
                        btnn.innerHTML = "Subscribed";
                        Subscribed = true
                    }else{
                        btnn.innerHTML = "Subscribe";
                        Subscribed =false;
                    }
                    btnn.disabled = false;
                },3000);
            }

            //arrow function
            const afunction = () => {
                console.log("Arrow functions");
            };
            afunction();
            
            //passing arguments to arrow functions without parenthesis
            const oneParam = param => {
                console.log(param + 1);
            };
            oneParam(2);

            //you can also write code without flower brackets if you have only one line of code
            const oneLine = () => console.log("inside function without flower brackets", 2+1);
            oneLine();

            //eventListerner
            const btn_event = document.querySelector(".evt-btn");
            const btnevnt = () => {console.log("Button clicked")};
            btn_event.addEventListener('click', btnevnt());//adding event listner
            btn_event.removeEventListener('click',btnevnt());//removing an event listner
            //adding multiple event listner to an single button
            btn_event.addEventListener('click', () => console.log("Inside another event listner"));
            
            //adding event listner using event object from which we can play or perform a event using keyboard
            document.body.addEventListener('keydown', (event) =>{
                console.log(event.key); //tells us which key we pressed in out keyboard
            });

        </script>
    </body>
</html>
