<!DOCTYPE html>
<html>
    <head>
        <title>Array and loops</title>
    </head>
    <body>
        ToDo list practice one:<br><br>
        <input class="js-input-todo" placeholder="ToDo name">
        <button onclick="gettodo()">Add</button>
        <div class="js-todo-lists"></div>
    <script>
        const todolist = [];
        renderToDoList();
        function renderToDoList(){
            let todolits = '' ;
            for ( let i = 0 ; i < todolist.length ; i++){
                const todo = `<p>${todolist[i]}</p>`;
                todolits += todo;
            }
            document.querySelector('.js-todo-lists').innerHTML = todolits;
        }
        function gettodo(){
            const inele = document.querySelector('.js-input-todo');
            const ele = inele.value;
            todolist.push(ele);
            console.log(todolist);

            inele.value='';
            renderToDoList();
        }   
        const arr=[10,20,30];
        console.log(arr);
        console.log(arr[0]);
        arr[2]=50;
        console.log(arr);
        [1,'hello',true,{name: 'socks'},[1,2]];
        console.log(typeof([1,2]));
        console.log(arr.length);
        arr.push(100);
        console.log(arr);
        arr.splice(1,1);
        console.log(arr);
    </script>
    </body>
</html>
